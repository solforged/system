# Global Vale rules for prose that reads as written by a person. Vale merges
# this file under every project's .vale.ini; a project's MinAlertLevel wins,
# so run `vale --minAlertLevel warning <files>` where a project sets "error".
# Run `vale sync` after changing Packages.
MinAlertLevel = warning
Packages = https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells.zip

# Rules are enabled one by one: Vale keeps only one section's BasedOnStyles
# when a project section also matches, but it merges individual rules.
[*.{md,mdx}]
Voice.Concerns = YES
Voice.DisclaimerTail = YES
Voice.SemicolonDensity = YES
Voice.ShellSubject = YES

# Hand-picked ai-tells rules; the rest of the package is tuned for technical
# docs and floods essay prose with false positives.
ai-tells.ConsequenceParticiple = warning
ai-tells.ContrastiveFormulas = warning
ai-tells.EmDashUsage = warning
ai-tells.MicDrop = warning
ai-tells.PseudoCleft = warning
ai-tells.ShellNounCopula = warning

# Quoted sources keep their own wording; wiki-link slugs are URLs.
TokenIgnores = ("[^"\n]+"), (“[^”\n]+”), (\[\[[^\]|]+)
BlockIgnores = (?m)^>.*$
