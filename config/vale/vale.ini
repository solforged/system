# Global Vale rules for prose that reads as written by a person. Vale merges
# this file under every project's .vale.ini; a project's MinAlertLevel wins,
# so run `vale --minAlertLevel warning <files>` where a project sets "error".
#
# The rules are the Voice style in styles/Voice, linked to
# ~/.local/share/vale/styles/Voice. styles/Voice/Brief.md is the house style
# they enforce. American is an error; the rest are advisory warnings. Run the
# rules' own tests with
#   vale --no-global --config config/vale/test.ini test --coverage config/vale/styles/Voice
# A project that gates on prose vendors a copy of the style with `vale-voice`
# and runs with --no-global.
#
# Voice.Spelling and Voice.SpellingCompound are left to those projects. Vale
# resolves their dictionary path against the project's StylesPath, so enabled
# here they fail in every project with styles of its own; and without a
# project vocabulary they report every product and tool name.
MinAlertLevel = warning

# Rules are enabled one by one: Vale keeps only one section's BasedOnStyles
# when a project section also matches, but it merges individual rules.
[*.{md,mdx}]
Voice.American = YES
Voice.Filler = YES
Voice.Tics = YES
Voice.Inflated = YES
Voice.WeakVerbs = YES
Voice.Hedging = YES
Voice.Puffery = YES
Voice.Weasel = YES
Voice.ThroatClearing = YES
Voice.Signoff = YES
Voice.SuperficialAnalysis = YES
Voice.Recap = YES
Voice.Lead = YES
Voice.ConsequenceParticiple = YES
Voice.ContrastiveFormulas = YES
Voice.MicDrop = YES
Voice.PseudoCleft = YES
Voice.ShellNounCopula = YES
Voice.Dashes = YES
Voice.Concerns = YES
Voice.DisclaimerTail = YES
Voice.SemicolonDensity = YES
Voice.ShellSubject = YES
Voice.BoldLabels = YES
Voice.BoldHeadings = YES
Voice.Arrows = YES
Voice.Openers = YES
Voice.ListItemLength = YES
Voice.ListDepth = YES
Voice.SectionLength = YES
Voice.ChangeNarration = YES

# A block quotation is a source and keeps its own wording. Inline quotation
# marks are linted, since they also hold authored labels; exempt a quoted
# source in place with `<!-- vale Voice.Spelling["colour"] = NO -->` and the
# matching `= YES`. Wiki-link slugs are URLs.
TokenIgnores = (\[\[[^\]|]+)
BlockIgnores = (?m)^>.*$

# A README is an entry point with a word budget; a changelog narrates changes.
[**/{README,readme}.md]
Voice.ReadmeLength = YES

[**/{CHANGELOG,CHANGES,changelog}.md]
Voice.ChangeNarration = NO

# Interface text: the strings a person reads or hears in React components
# (config/views/UiCopy.yml), checked for the register of a label rather than
# of a narrator. A project whose interface speaks in a deliberate voice turns
# the Ui rules off in its own .vale.ini.
[*.{tsx,jsx}]
View = UiCopy
Voice.UiGuarantee = YES
Voice.UiNarration = YES
Voice.UiCadence = YES
Voice.UiLength = YES
Voice.UiSemicolon = YES
Voice.Openers = YES
Voice.Signoff = YES
Voice.Filler = YES
Voice.Tics = YES
Voice.Inflated = YES
Voice.Hedging = YES
Voice.Dashes = YES
Voice.ContrastiveFormulas = YES
Voice.DisclaimerTail = YES
