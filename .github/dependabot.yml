# Weekly GitHub Actions updates; the actions are pinned by commit. Flake
# inputs are bumped by .github/workflows/bump.yml instead, which updates
# every input (the private theme too) in one evaluated commit.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
