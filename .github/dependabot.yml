# Weekly flake input updates. Security updates are not throttled by the
# cooldown; version updates wait out the default 3-day cooldown.
version: 2
updates:
  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "weekly"
    # The theme input needs a token at fetch time, so Dependabot cannot
    # update it; leave it to the quarterly human pass.
    ignore:
      - dependency-name: "solforge-theme"
    commit-message:
      prefix: "chore(flake)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
